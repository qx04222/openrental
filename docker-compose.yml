# Set POSTGRES_PASSWORD and BOOTSTRAP_ADMIN_PASSWORD before starting.
# Empty databases initialize automatically. Existing volumes are preserved.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong URL-safe database password}
      POSTGRES_USER: openrental
      POSTGRES_DB: openrental
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openrental"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://openrental:${POSTGRES_PASSWORD}@db:5432/openrental
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set a unique admin password of at least 20 characters}
      NODE_ENV: production
      PORT: 3000
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Toronto}
      CRON_TIMEZONE: ${APP_TIMEZONE:-America/Toronto}
      SITE_URL: http://localhost:3000
    ports: ["127.0.0.1:3000:3000"]
volumes:
  pgdata:
