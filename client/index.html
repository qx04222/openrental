<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F2937" />
    <title>OpenRental</title>
    <meta name="description" content="Self-hostable equipment rental management: fleet ledger, order lifecycle, pricing, invoicing and deposits." />
    <!-- This is an operations system, not a public website: nothing here should
         be indexed, and there is no marketing surface to optimise for. -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Archivo:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Manifest and apple-touch-icon are injected server-side per audience
         (admin / field / portal), so each installed PWA gets its own badge. -->
    <!--MANIFEST-->
    <link rel="icon" type="image/png" href="/admin-icons/icon-192.png" />

    <!-- Pick the brand surface before React mounts so customer-facing routes
         paint without a flash. Mirrors isPublicSurface() in App.tsx. -->
    <script>
      (function () {
        var p = location.pathname;
        var pub = ["/rental-request", "/rental-status", "/checkout", "/portal"].some(function (x) {
          return p === x || p.indexOf(x + "/") === 0;
        });
        document.documentElement.dataset.surface = pub ? "public" : "admin";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
