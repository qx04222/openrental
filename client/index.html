<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F2937" />
    <title>OpenRental</title>
    <meta name="description" content="Self-hostable equipment rental management: fleet ledger, order lifecycle, pricing, invoicing and deposits." />
    <!-- This is an operations system, not a public website: nothing here should
         be indexed, and there is no marketing surface to optimise for. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Manifest and apple-touch-icon are injected server-side per audience
         (admin / field / portal), so each installed PWA gets its own badge. -->
    <!--MANIFEST-->
    <link rel="icon" type="image/png" href="/admin-icons/icon-192.png" />

    <!-- Pick the brand surface before React mounts so customer-facing routes
         paint without a flash. Mirrors isPublicSurface() in App.tsx. -->
    <script src="/surface-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
