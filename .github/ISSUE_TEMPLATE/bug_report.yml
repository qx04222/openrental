name: Bug report
description: Something behaves differently than it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Smallest reproduction
      description: |
        Steps, or a failing test. If money is involved, include the actual
        numbers — "the total was wrong" is not reproducible.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Postgres and Node version
      placeholder: "Postgres 16, Node 22"
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I have removed any real customer data from the report
          required: true
