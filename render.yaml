# One-click deploy to Render. https://render.com/deploy?repo=https://github.com/qx04222/openrental
#
# Gives you a private instance with its own Postgres. After the first deploy,
# open a shell on the service and bootstrap the database:
#
#   npm run db:baseline && npm run seed && npm run seed:demo
#
# Then sign in at /admin as admin / admin123 and change the password.
services:
  - type: web
    name: openrental
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: openrental-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Set these to your yard's zone before entering real data — every rental
      # day and due date is anchored to it.
      - key: APP_TIMEZONE
        value: America/Toronto
      - key: CRON_TIMEZONE
        value: America/Toronto

databases:
  - name: openrental-db
    plan: basic-256mb
    postgresMajorVersion: "16"
