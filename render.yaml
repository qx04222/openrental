# One-click deploy to Render. https://render.com/deploy?repo=https://github.com/qx04222/openrental
#
# Empty databases initialize automatically with a unique administrator password.
# Existing databases are preserved; no demo users or customer fixtures are installed.
services:
  - type: web
    name: openrental
    runtime: docker
    plan: starter
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: openrental-db
          property: connectionString
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Set these to your yard's zone before entering real data — every rental
      # day and due date is anchored to it.
      - key: APP_TIMEZONE
        value: America/Toronto
      - key: CRON_TIMEZONE
        value: America/Toronto

databases:
  - name: openrental-db
    plan: basic-256mb
    postgresMajorVersion: "16"
