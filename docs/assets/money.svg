<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 372" width="980" height="372" role="img" aria-label="Where a customer's money can be: allocated to an invoice, held as a deposit, or on the customer's credit balance">
  <style>
    .box   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .box-m { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .box-h { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
    .box-c { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .lbl   { font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
    .sub   { font: 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; }
    .hdr   { font: 700 12px ui-sans-serif, system-ui, sans-serif; fill: #64748b; letter-spacing: .08em; }
    .note  { font: italic 12px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
    .arrow { stroke: #94a3b8; stroke-width: 1.5; fill: none; marker-end: url(#b); }
    .rule  { stroke: #e2e8f0; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .box   { fill: #0f172a; stroke: #334155; }
      .box-m { fill: #052e21; stroke: #10b981; }
      .box-h { fill: #2a1e05; stroke: #f59e0b; }
      .box-c { fill: #172554; stroke: #3b82f6; }
      .lbl   { fill: #e2e8f0; }
      .sub   { fill: #94a3b8; }
      .hdr   { fill: #94a3b8; }
      .note  { fill: #cbd5e1; }
      .arrow { stroke: #475569; }
      .rule  { stroke: #1e293b; }
    }
  </style>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text class="hdr" x="20" y="26">EVERY DOLLAR IS IN EXACTLY ONE OF THREE PLACES</text>

  <rect class="box" x="20" y="88" width="150" height="60" rx="8"/>
  <text class="lbl" x="95" y="114" text-anchor="middle">Customer pays</text>
  <text class="sub" x="95" y="132" text-anchor="middle">cash · e-transfer · card</text>

  <rect class="box-m" x="300" y="56" width="200" height="62" rx="8"/>
  <text class="lbl" x="400" y="82" text-anchor="middle">Allocated to an invoice</text>
  <text class="sub" x="400" y="100" text-anchor="middle">reduces balanceDue</text>

  <rect class="box-h" x="300" y="140" width="200" height="62" rx="8"/>
  <text class="lbl" x="400" y="166" text-anchor="middle">Held as a deposit</text>
  <text class="sub" x="400" y="184" text-anchor="middle">against the order, not revenue</text>

  <rect class="box-c" x="300" y="224" width="200" height="62" rx="8"/>
  <text class="lbl" x="400" y="250" text-anchor="middle">Customer credit balance</text>
  <text class="sub" x="400" y="268" text-anchor="middle">a liability you owe back</text>

  <path class="arrow" d="M170 112 C230 112 240 87 296 87"/>
  <path class="arrow" d="M170 118 C230 118 240 171 296 171"/>
  <path class="arrow" d="M170 124 C230 124 240 255 296 255"/>

  <rect class="box" x="640" y="140" width="200" height="62" rx="8"/>
  <text class="lbl" x="740" y="166" text-anchor="middle">Applied to rent</text>
  <text class="sub" x="740" y="184" text-anchor="middle">appliedAt</text>

  <rect class="box" x="640" y="224" width="200" height="62" rx="8"/>
  <text class="lbl" x="740" y="250" text-anchor="middle">Moved to balance</text>
  <text class="sub" x="740" y="268" text-anchor="middle">transferredToCreditAt</text>

  <path class="arrow" d="M500 168 H636"/>
  <path class="arrow" d="M500 180 C560 180 570 248 636 248"/>

  <line class="rule" x1="20" y1="316" x2="960" y2="316"/>
  <text class="note" x="20" y="342">A closed order may not leave a deposit in limbo — it goes to rent or to the balance, and both are stamped. Tests assert the three buckets sum to what was taken in.</text>
</svg>
